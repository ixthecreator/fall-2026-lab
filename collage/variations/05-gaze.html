    <title>05 / The face looks back / Six borrowed faces</title>
    <meta
      name="description"
      content="A draggable photographic face collage influenced by Tony Oursler and computational facial structures."

        <title id="art-title">05 / The face looks back</title>
        <desc id="art-desc">
          Original collage layout influenced by Tony Oursler’s projected facial
          fragments and by mesh-478-study. Found photographs by Julia Margaret
          Cameron, Nadar and Dorothea Lange. Drag facial fragments; arrow keys
          move the focused fragment; Escape restores the composition. This
          artwork does not run face recognition.
        </desc>
