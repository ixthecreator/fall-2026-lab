        <desc id="art-desc">

          fragments and by landmarks-106. Found photographs by Julia Margaret
          Cameron, Nadar and Dorothea Lange. Drag facial fragments; arrow keys
          move the focused fragment; Escape restores the composition. This
          artwork does not run face recognition.
