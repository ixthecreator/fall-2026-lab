        <title id="art-title">02 / Borrowed contours</title>
        <desc id="art-desc">
          Original collage layout influenced by Tony Oursler’s projected facial
          fragments and by landmarks-68. Found photographs by Julia Margaret
          Cameron, Nadar and Dorothea Lange. Drag facial fragments; arrow keys
          move the focused fragment; Escape restores the composition. This
          artwork does not run face recognition.
