<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" role="img" aria-labelledby="title desc">
<title id="title">A ten-region plan for the collage</title><desc id="desc">An original schematic face divided into forehead, two brows, two eyes, nose, two cheeks, mouth and chin. These are design regions, not the output of a face recognition system.</desc>
