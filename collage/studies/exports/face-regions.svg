<g font-family="Arial,sans-serif" fill="#65685f" font-size="17"><text x="514" y="483">Collage groups, defined by the designer.</text><text x="514" y="512">Forehead, cheeks and chin need custom masks.</text><text x="514" y="541">Skin labels alone do not separate these areas.</text><text x="42" y="608">Original schematic. Illustrative boundaries; not a measured face, anatomical atlas or model prediction.</text></g></svg>
