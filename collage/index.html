<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive collage of movable facial features."
    />
    <title>Borrowed Face</title>
    <link rel="icon" href="assets/node.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="interaction.js" defer></script>
  </head>
  <body>
    <main aria-label="Borrowed Face — interactive collage">
      <p id="move-help" class="visually-hidden">
        Drag a facial feature to move it. With a keyboard, focus a feature and
        use the arrow keys.
      </p>
      <div class="stage" aria-label="Movable facial features">
        <figure class="portrait main-portrait" id="portrait-main">
          <img
            src="assets/herschel.jpg"
            alt="John Herschel, photographed by Julia Margaret Cameron, 1867."
            draggable="false"
          />
        </figure>
        <figure class="portrait echo-portrait" id="portrait-echo">
          <img
            src="assets/bernhardt.jpg"
            alt="Sarah Bernhardt, photographed by Nadar, around 1864."
            draggable="false"
          />
        </figure>
        <figure class="portrait witness-portrait" id="portrait-witness">
          <img
            src="assets/thompson.jpg"
            alt="Florence Owens Thompson in Dorothea Lange’s Migrant Mother, 1936."
            draggable="false"
          />
        </figure>
        <figure
          class="fragment eye-left green"
          data-node="eye-left"
          style="--crop-x: 39%; --crop-y: 28%; --zoom: 6"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move left eye"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/thompson.jpg"
                alt="Left eye, cropped from the Lange portrait of Florence Owens Thompson."
                draggable="false"
            /></span>
          </button>
        </figure>
        <figure
          class="fragment eye-right pink"
          data-node="eye-right"
          style="--crop-x: 68%; --crop-y: 51%; --zoom: 5"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move right eye"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/herschel.jpg"
                alt="Right eye, cropped from the Cameron portrait of John Herschel."
                draggable="false"
            /></span>
          </button>
        </figure>
        <figure
          class="fragment nose plain"
          data-node="nose"
          style="--crop-x: 61%; --crop-y: 61%; --zoom: 4"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move nose"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/herschel.jpg"
                alt="Nose, cropped from the Cameron portrait of John Herschel."
                draggable="false"
            /></span>
          </button>
        </figure>
        <figure
          class="fragment mouth pink"
          data-node="mouth"
          style="--crop-x: 45%; --crop-y: 38%; --zoom: 5"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move mouth"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/thompson.jpg"
                alt="Mouth, cropped from the Lange portrait of Florence Owens Thompson."
                draggable="false"
            /></span>
          </button>
        </figure>
        <figure
          class="fragment eye-spare blue"
          data-node="eye-spare"
          style="--crop-x: 45%; --crop-y: 24%; --zoom: 7"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move borrowed eye"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/bernhardt.jpg"
                alt="Borrowed eye, cropped from the Nadar portrait of Sarah Bernhardt."
                draggable="false"
            /></span>
          </button>
        </figure>
        <figure
          class="fragment mouth-spare green"
          data-node="mouth-spare"
          style="--crop-x: 62%; --crop-y: 72%; --zoom: 5"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move borrowed mouth"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/herschel.jpg"
                alt="Borrowed mouth, cropped from the Cameron portrait of John Herschel."
                draggable="false"
            /></span>
          </button>
        </figure>
        <figure
          class="fragment ear plain"
          data-node="ear"
          style="--crop-x: 60%; --crop-y: 30%; --zoom: 5"
        >
          <button
            type="button"
            class="handle"
            aria-label="Move ear and cheek"
            aria-describedby="move-help"
          >
            <span class="crop"
              ><img
                src="assets/bernhardt.jpg"
                alt="Ear and cheek, cropped from the Nadar portrait of Sarah Bernhardt."
                draggable="false"
            /></span>
          </button>
        </figure>
        <svg class="connections" aria-hidden="true"></svg>
      </div>
      <p class="status visually-hidden" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
