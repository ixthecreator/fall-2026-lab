      <p class="visually-hidden" id="move-help">
        Drag any circular node or facial feature. Arrow keys move the focused

      <svg

        <title id="art-title">VIE, Tony Oursler, 2014</title>
        <desc id="art-description">
          A large freestanding photographic face in a white gallery. Orange and
          dark facial mapping lines link circular nodes. A vivid green eye fills
          the right rectangular window; the left window shows the room behind
          it. Original artwork © Tony Oursler, courtesy Lisson Gallery. The 22
          visible circular nodes and four facial regions can be moved in this
          web study. The network is reconstructed as individual vector elements.
        </desc>
