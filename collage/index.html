<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive study of Tony Oursler’s VIE (2014), using the original artwork photograph from Lisson Gallery."
    />
    <title>VIE — Interactive study after Tony Oursler</title>
    <link rel="icon" href="assets/node.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=4" />
    <script src="interaction.js?v=4" defer></script>
  </head>
  <body>
    <main aria-label="Interactive study of Tony Oursler’s VIE, 2014">
      <p class="visually-hidden" id="move-help">
        Drag an eye window, nose, or mouth to move it. Use arrow keys when a
        feature is focused. Press Escape to restore the original arrangement.
      </p>
      <svg
        class="artwork"
        viewBox="0 0 749 1000"
        xmlns="http://www.w3.org/2000/svg"
        aria-labelledby="art-title art-description"
      >
        <title id="art-title">VIE, Tony Oursler, 2014</title>
        <desc id="art-description">
          A large freestanding photographic face in a white gallery. Orange and
          dark facial mapping lines link circular nodes. A vivid green eye fills
          the right rectangular window; the left window shows the room behind
          it. Original artwork © Tony Oursler, courtesy Lisson Gallery. The
          four facial regions can be moved in this web study.
        </desc>
        <image
          href="assets/oursler-vie.jpg"
          width="749"
          height="1000"
          preserveAspectRatio="none"
        />
        <g aria-hidden="true">
          <rect
            data-hole="left-eye"
            x="233"
            y="408"
            width="100"
            height="66"
            fill="#d7d6ce"
            opacity="0"
          />
          <rect
            data-hole="right-eye"
            x="392"
            y="399"
            width="122"
            height="78"
            fill="#d7d6ce"
            opacity="0"
          />
          <rect
            data-hole="nose"
            x="328"
            y="507"
            width="72"
            height="80"
            fill="#b8b4b8"
            opacity="0"
          />
          <rect
            data-hole="mouth"
            x="290"
            y="636"
            width="128"
            height="53"
            fill="#b8b4b8"
            opacity="0"
          />
        </g>
        <g class="connections" aria-hidden="true"></g>
        <svg
          class="feature"
          data-feature="left-eye"
          x="233"
          y="408"
          width="100"
          height="66"
          viewBox="233 408 100 66"
          role="button"
          tabindex="0"
          aria-label="Move left eye window"
          aria-describedby="move-help"
        >
          <image
            href="assets/oursler-vie.jpg"
            width="749"
            height="1000"
            preserveAspectRatio="none"
          /></svg
        ><svg
          class="feature"
          data-feature="right-eye"
          x="392"
          y="399"
          width="122"
          height="78"
          viewBox="392 399 122 78"
          role="button"
          tabindex="0"
          aria-label="Move green right eye"
          aria-describedby="move-help"
        >
          <image
            href="assets/oursler-vie.jpg"
            width="749"
            height="1000"
            preserveAspectRatio="none"
          /></svg
        ><svg
          class="feature"
          data-feature="nose"
          x="328"
          y="507"
          width="72"
          height="80"
          viewBox="328 507 72 80"
          role="button"
          tabindex="0"
          aria-label="Move nose"
          aria-describedby="move-help"
        >
          <image
            href="assets/oursler-vie.jpg"
            width="749"
            height="1000"
            preserveAspectRatio="none"
          /></svg
        ><svg
          class="feature"
          data-feature="mouth"
          x="290"
          y="636"
          width="128"
          height="53"
          viewBox="290 636 128 53"
          role="button"
          tabindex="0"
          aria-label="Move mouth"
          aria-describedby="move-help"
        >
          <image
            href="assets/oursler-vie.jpg"
            width="749"
            height="1000"
            preserveAspectRatio="none"
          />
        </svg>
      </svg>
      <p class="status visually-hidden" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
